dbus:
    candy:
        description: |
            A supervisord-managed D-Bus session bus exported at a unix-socket address for in-container clients
            Installs the distro D-Bus package (the dbus-daemon binary) and runs a
            session bus under supervisord as `dbus-daemon --session --nofork
            --address=unix:path=/tmp/dbus-session`, exporting
            DBUS_SESSION_BUS_ADDRESS so notification senders, introspection tools,
            and the `dbus:` check verb's gdbus clients in the container can reach the bus.
            Every claim is verifiable: the dbus-daemon binary on disk and the
            providing package installed at build scope, and at deploy scope the
            session-bus address env var exported plus the dbus service running.
        require:
            - '@github.com/opencharly/layer-supervisord:v2026.271.1817'
        env:
            DBUS_SESSION_BUS_ADDRESS: "unix:path=/tmp/dbus-session"
        distro:
            arch:
                package:
                    - dbus
            debian:
                package:
                    - dbus
            fedora:
                package:
                    - dbus-daemon
            ubuntu:
                package:
                    - dbus
        service:
            - name: dbus
              exec: "dbus-daemon --session --nofork --address=unix:path=/tmp/dbus-session"
              env:
                XDG_RUNTIME_DIR: /tmp
              restart: always
              priority: 2
              enable: true
              scope: system
        plan:
            - check: the dbus-daemon binary is installed at /usr/bin/dbus-daemon
              file:
                file: /usr/bin/dbus-daemon
                exists: true
            - check: the providing D-Bus package is installed (dbus-daemon on Fedora, dbus on Arch/Debian/Ubuntu)
              package:
                package: dbus-daemon
                package_map:
                    arch: dbus
                installed: true
            - check: the DBUS_SESSION_BUS_ADDRESS env var is exported as a unix-socket address
              exit_status: 0
              stdout:
                - contains: "unix:path="
              context:
                - runtime
              command: printenv DBUS_SESSION_BUS_ADDRESS
            - check: the supervised dbus session-bus service is running
              context:
                - runtime
              service:
                service: dbus
                running: true
            - agent-check: the supervised dbus service keeps the session bus reachable, restarting automatically (restart=always) if the dbus-daemon process exits

# ---------------------------------------------------------------------------
# The verb/schema skills this repo's own candy owns — routing only.
#
# Each node carries `name`/`family`/`owner` (plus `triggers:` where the skill
# generates DISPATCHER.md rows). The prose is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an inline `description:`
# or `content:` — an inline body that disagrees with its file is a hard error
# in the marketplace generator. `family:` is the marketplace family the skill
# was authored under, kept so every existing `/charly-<family>:<name>` address
# still resolves; `owner:` names the candy whose command/kind surface the
# skill documents. This candy composes no image, so these nodes add nothing to
# any `ai.opencharly.skill` OCI label; the bodies reach consumers through the
# generated marketplace corpus.
# ---------------------------------------------------------------------------
dbus-layer-skill:
  skill:
    name: dbus-layer
    family: infrastructure
    owner: dbus
